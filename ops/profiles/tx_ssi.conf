# tx0 SSI delay row (ADRV9001 tx0 clk / data+strobe) per board AND per image.
# Looked up by ops/tx_ssi_row.sh from bringup_r2r3.sh (rungs r3 and r4 -- the same 61.44 MSPS
# profile, so the same eye; sp4 images get their own row here once measured) when SSI148 / SSI146
# are not set in the environment; an env value always wins; "default" is the row for images not listed.
#
# WHY per image (docs/evidence/sp3/SP3_GATE3_RETEST.md): the SSI TX outputs are unconstrained
# in the build and the eye moves with the bitstream. On 148 with the sp3 image c5ec53bc610c the
# rows 5/4 and 6/4 are dead (CRC 46 % / 0 %, carrier-reset storm within 17 s) and the sp2-era
# pinned row 5/3 sits one step from that edge: 3 of 6 arms at 5/3 wedged within 120 s. The driver's
# PRBS auto-tune itself returned 5/3, 5/4 and 6/4 on different boots of the same image.
#
# ip            image(12-hex md5 | default)   clk data
10.0.0.148      default                        5   3
10.0.0.148      c5ec53bc610c                   4   3    # sp3: 0 bad of 3 arms (5/3: 5 bad of 8; 5/4, 6/4, 4/4 dead on some arms)
10.0.0.146      default                        3   4
# ONE-WAY images (roles TXO/RXO, ops/oneway_bringup.sh): add a row per TX-only image md5 once banked;
# until then the TX board inherits its "default" row above (oneway_bringup.sh SSI_TX="clk dat" overrides).
